# HiveKeeper handles SSH credentials, signs certificates and holds the keys that decrypt a fleet's secrets.
# A known CVE sitting in a transitive dependency for six months is not an acceptable state for that.
#
# Weekly, grouped: one PR per ecosystem for the routine bumps (which nobody reads individually anyway) and a
# separate PR for each major, which is the one that actually needs a human.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /hive-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # React 19 is not installable in this console, and the blocker is not in this repo. @mriqbox/ui-kit
      # declares react/react-dom as ordinary DEPENDENCIES pinned to ^18.2.0 rather than peers, and its
      # published bundle reads React 18 internals that React 19 removed. Attempted on 2026-08-07 and reverted:
      # a pnpm override deduplicates to one React 19 copy and every ui-kit component throws at import time.
      # Re-checked on 2026-08-21 against ui-kit 4.20.1 - still ^18.2.0, still a dependency, still blocked.
      #
      # Dependabot cannot hold an expiry, so the deadline lives next door: .trivyignore.yaml suppresses
      # GHSA-qwww-vcr4-c8h2 (the react-router advisory this same pin keeps us from fixing) until 2026-11-05.
      # When that goes red, this entry is what has to be revisited. Minor and patch bumps still come through.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The release tooling at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The base images the stack is built on: a JRE with an unpatched CVE is exactly as exploitable as one of ours.
  - package-ecosystem: docker
    directories:
      - /hive-gateway
      - /hive-agent
      - /hive-server
      - /hive-web
    schedule:
      interval: weekly
    ignore:
      # Stay on the Java LTS train. Temurin cuts an image for every feature release, so Dependabot proposed
      # 25 -> 26 within days of it shipping (#40, #41, #42, closed on 2026-08-21). A feature release is
      # supported for roughly six months and then stops getting security rebuilds entirely - which for a
      # base image is the opposite of what this ecosystem is configured for. 25 is the current LTS; 29 is
      # the next one, due September 2027, and that is when this entry should be removed.
      #
      # Only majors are ignored: 25.0.1 -> 25.0.2, the rebuilds that carry the CVE fixes, still arrive weekly.
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
