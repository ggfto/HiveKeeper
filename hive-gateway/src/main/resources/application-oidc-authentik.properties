# OIDC profile for Authentik: SPRING_PROFILES_ACTIVE=postgres,oidc,oidc-authentik
# This profile is layered ON TOP of `oidc` (which every OIDC bean requires) and only overrides the IdP-specific
# settings below. Listing it last is what makes these values win.
# The gateway validates JWTs from this issuer (Authentik in dev). The IdP only authenticates; org/site/group
# roles live in our database. Override the URLs for a real IdP via the env vars.
hivekeeper.oidc.issuer=${HIVEKEEPER_OIDC_ISSUER:http://localhost:9000/application/o/hivekeeper/}
hivekeeper.oidc.jwk-set-uri=${HIVEKEEPER_OIDC_JWK_SET_URI:http://localhost:9000/application/o/hivekeeper/jwks/}
# Reject tokens not minted for this resource (audience confusion): a token is accepted only if its aud
# contains this value or its azp equals it. Defaults to the gateway client id.
hivekeeper.oidc.audience=${HIVEKEEPER_OIDC_AUDIENCE:hive-gateway}

# The public client the BROWSER uses for auth-code + PKCE. Handed to the console at runtime via /api/mode
# (together with the issuer above), so the published console image needs nothing baked in and works against
# whatever provider a self-hoster points it at.
hivekeeper.oidc.client-id=${HIVEKEEPER_OIDC_CLIENT_ID:hive-gateway}

# Pick the Authentik implementation of IdpAdminClient over the default Keycloak one. This property, not the
# profile name, is what selects the provider — see application-oidc.properties.
hivekeeper.idp=authentik

# First-run setup creates the first admin in Authentik via the Admin API. These are the operator's own Authentik
# coordinates + API token (dev defaults: admin token from Authentik setup).
hivekeeper.authentik.base-url=${HIVEKEEPER_AUTHENTIK_BASE_URL:http://localhost:9000}
hivekeeper.authentik.api-token=${HIVEKEEPER_AUTHENTIK_API_TOKEN}
