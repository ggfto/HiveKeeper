# Identity-provider overlay: SELF-HOSTED KEYCLOAK. This is the shape the production runbook has always
# described — Keycloak in the stack, served by Caddy at /auth on the same hostname. Layer it on the base:
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.prod.keycloak.yml up -d
#
# The alternative is docker-compose.prod.authentik.yml, which points the gateway at an Authentik you already
# operate and adds no identity services here at all. Layer exactly ONE of the two: they both set the gateway's
# issuer, and the last one listed would silently win.

name: hivekeeper

services:
  gateway:
    environment:
      # The issuer is what the BROWSER logs in at — Keycloak lives under /auth on the same hostname. The
      # console reads this back from /api/mode, so nothing is baked into its bundle.
      HIVEKEEPER_OIDC_ISSUER: https://${HIVEKEEPER_DOMAIN}/auth/realms/hivekeeper
      # ...while the gateway itself reaches Keycloak over the internal network, by service name.
      HIVEKEEPER_OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/hivekeeper/protocol/openid-connect/certs
      HIVEKEEPER_OIDC_AUDIENCE: hive-gateway
      HIVEKEEPER_KEYCLOAK_BASE_URL: http://keycloak:8080/auth
      HIVEKEEPER_KEYCLOAK_REALM: hivekeeper
      HIVEKEEPER_KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set it}
      HIVEKEEPER_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set it}
    depends_on:
      keycloak:
        condition: service_healthy

  # Both databases, because either alone is useless: restore the gateway's without Keycloak's and every role
  # grant points at a user id that no longer exists — nobody can sign in, you included.
  backup:
    environment:
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set it}
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # `start`, not `start-dev`: production mode. It runs plain HTTP behind Caddy, which terminates TLS —
    # hence http-enabled and proxy-headers, so Keycloak builds its issuer and redirect URLs from the
    # X-Forwarded-* headers Caddy sets rather than from the container's own address.
    #
    # No --hostname-strict-https here: Keycloak 26 uses hostname v2, which REMOVED that flag (start fails with
    # "Unknown option" and restart-loops). Setting KC_HOSTNAME to an https URL is what v2 wants instead.
    command: ["start", "--optimized=false", "--http-enabled=true", "--proxy-headers=xforwarded"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set it}
      KC_HOSTNAME: https://${HIVEKEEPER_DOMAIN}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set it}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set it}
    healthcheck:
      # Reach Keycloak's management-port (9000) health through bash's /dev/tcp — there is no curl/wget in the
      # image. Verified against a live Keycloak 26.0.8: use bash (the image's /bin/sh has no /dev/tcp), hit
      # /auth/health/ready (KC_HTTP_RELATIVE_PATH=/auth prefixes the management interface too, so the bare
      # path 404s), and match a 200 status (Keycloak returns 503 until ready).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

  # Creates the realm, the console's public client (auth-code + PKCE) and — given credentials — the GitHub
  # identity provider. Idempotent, so it runs on every `up` and reconciles any drift. Runs to completion and
  # exits; `restart: "no"` keeps compose from treating that as a crash.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.0
    entrypoint: ["/bin/bash", "/bootstrap.sh"]
    environment:
      KC_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set it}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set it}
      HIVEKEEPER_CONSOLE_URL: https://${HIVEKEEPER_DOMAIN}
      HIVEKEEPER_REALM: hivekeeper
      HIVEKEEPER_OIDC_CLIENT_ID: hive-gateway
      HIVEKEEPER_GITHUB_CLIENT_ID: ${HIVEKEEPER_GITHUB_CLIENT_ID:-}
      HIVEKEEPER_GITHUB_CLIENT_SECRET: ${HIVEKEEPER_GITHUB_CLIENT_SECRET:-}
    volumes:
      - ./deploy/keycloak/bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  # Periodic pg_dump of BOTH databases into the pg-backups volume. Both, because either alone is useless:
  # restore the gateway's without Keycloak's and every role grant points at a user id that no longer exists —
  # nobody can sign in, you included.
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set it}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  keycloak-db-data:
